name: Docker Image CI

# No `pull_request` trigger on purpose: a PR build would push :latest, which
# watchtower auto-deploys to prod.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read   # checkout

# Two pushes to main in a row must not race: the runs are independent and the
# older one may finish last, leaving its :latest on the registry — watchtower
# polls every 2 seconds and would ship the previous commit to prod.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"   # same as the Dockerfile base image

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests
      env:
        # Safety net for a search provider: the suite sets provider env vars
        # itself (monkeypatch), so this is not required today. The URL is never
        # contacted — the tests are offline (respx mocks all HTTP).
        SEARXNG_URL: http://searxng:8080
      run: pytest --tb=short -q

  build:
    runs-on: ubuntu-latest
    needs: test                          # no green tests → no image is built
    steps:
    - uses: actions/checkout@v7

    - name: Log in to the Gitea container registry
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # Org-level secret on `projects`; the built-in GITEA_TOKEN has no
        # package scope and cannot push images.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha> (watchtower deploys :latest)
      env:
        # Passed through the environment instead of being interpolated into the
        # script text: git allows `$`, backticks, quotes and parentheses in branch
        # names, so a branch like `feat/$(id)` would otherwise execute on the runner.
        REF_NAME: ${{ github.ref_name }}
        IMAGE: gitea.vvzvlad.xyz/${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        if [ "$REF_NAME" = "main" ]; then
          echo "tags=$IMAGE:latest $IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Sanitise the branch name into a legal docker tag: everything outside
          # [A-Za-z0-9_.-] becomes `-`, and the result is cut to 100 chars —
          # branch names have no length limit, docker rejects tags over 128.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-100)
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      run: |
        tag_args=""
        for tag in ${{ steps.tags.outputs.tags }}; do tag_args="$tag_args --tag $tag"; done
        # --pull is required here: unlike GitHub's ephemeral runners, cirunner-hatbox
        # is self-hosted with a persistent docker daemon, so a once-pulled
        # python:3.11-slim would sit in its cache for months and every build would
        # inherit an unpatched base layer.
        docker build --pull . --file Dockerfile $tag_args

    - name: Push Docker images
      run: |
        for tag in ${{ steps.tags.outputs.tags }}; do docker push "$tag"; done

    - name: Remove the built images from the runner
      # The runner's docker daemon is persistent, so every build would otherwise
      # leave its images and build-cache layers behind and grow the disk forever.
      # Only the tags built by this run are dropped — no `docker system prune`,
      # which would also wipe images of other repos sharing the same daemon.
      # `always()` so the cleanup runs even when the push above fails.
      if: always()
      run: |
        for tag in ${{ steps.tags.outputs.tags }}; do docker rmi "$tag" || true; done
